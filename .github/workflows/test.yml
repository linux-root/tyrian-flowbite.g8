name: Test template

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: coursier/setup-action@v3
        with:
          jvm: temurin:17
          apps: sbt giter8

      - run: ./test.sh 3

      # Note: the generated flake is not checked here. It only means anything inside a real generated
      # project, so that check belongs to the example repos, which render the template and can evaluate
      # the flake in place.
