name: Test template

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: coursier/setup-action@v3
        with:
          jvm: temurin:17
          apps: sbt giter8

      - run: ./test.sh 3

      # Note: the generated flake is not checked here. It only means anything inside a real generated
      # project, so that check belongs to the example repos, which render the template and can evaluate
      # the flake in place.

  # Tell the example repos a new template landed, so they sync now instead of
  # waiting for their 06:00 UTC cron. Runs only after the tests pass.
  #
  # Needs secret EXAMPLE_REPOS_TOKEN with Contents: read/write on both example
  # repos. GITHUB_TOKEN cannot do this: it is scoped to this repo only.
  # Without the secret the step no-ops, so CI stays green.
  notify-examples:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo:
          - linux-root/tyrian-flowbite-quickstart
          - linux-root/fullstack-zio-tyrian-flowbite-quickstart
    steps:
      - name: Fire template-updated event
        env:
          TOKEN: ${{ secrets.EXAMPLE_REPOS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "EXAMPLE_REPOS_TOKEN not set; ${{ matrix.repo }} will sync on its own cron."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ matrix.repo }}/dispatches" \
            -d '{"event_type":"template-updated"}'
