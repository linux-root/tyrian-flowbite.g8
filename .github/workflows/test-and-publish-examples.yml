name: Test template and publish examples

# Requires repo secret EXAMPLE_REPOS_TOKEN: a GitHub PAT with Contents
# read/write on:
#   - linux-root/tyrian-flowbite-quickstart
#   - linux-root/fullstack-zio-tyrian-flowbite-quickstart

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: coursier/setup-action@v3
        with:
          jvm: temurin:17
          apps: sbt giter8

      - run: ./test.sh 3

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-only
          path: test-template/frontend-only

      - uses: actions/upload-artifact@v4
        with:
          name: fullstack
          path: test-template/fullstack

  publish-examples:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - artifact: frontend-only
            repo: linux-root/tyrian-flowbite-quickstart
          - artifact: fullstack
            repo: linux-root/fullstack-zio-tyrian-flowbite-quickstart
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: rendered

      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.EXAMPLE_REPOS_TOKEN }}
          path: example

      - name: Sync rendered output into the example repo
        run: rsync -a --delete --exclude='.git' rendered/ example/

      - name: Commit and push if changed
        working-directory: example
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "chore: sync from linux-root/tyrian-flowbite.g8@${GITHUB_SHA::7}"
          git push
